<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="stylesheet" href="assets/css/style.css">
  <script defer src="assets/mathjax/tex-mml-chtml.js"></script>
</head>
<body>
  <div class="top">
    <div class="wrap topin">
      <a class="brand" href="index.html">پردازش آماری الگو / مسیر یادگیری</a>
      <div class="controls">
        <button aria-label="تغییر تم" class="icon" id="theme">
          <svg class="theme-svg sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="theme-svg moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="btn" id="present">حالت ارائه</button>
      </div>
    </div>
    <div class="progress"><span></span></div>
  </div>
  <main class="wrap">
    {{CONTENT}}
    <nav class="lesson-nav" aria-label="پیمایش درس‌ها">
      {{PREVIOUS_LINK}}
      <a class="btn" href="index.html">فهرست درس‌ها</a>
      {{NEXT_LINK}}
    </nav>
    <footer class="footer">مجموعهٔ آموزشی پردازش آماری الگو</footer>
  </main>
  <script src="assets/js/main.js"></script>
  <script src="{{LESSON_SCRIPT}}"></script>
</body>
</html>
